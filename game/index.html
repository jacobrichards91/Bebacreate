<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Build a Robot Vacuum! 🤖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1.2">
</head>
<body>

  <!-- TOP BAR -->
  <div id="top-bar">
    <div id="level-name">Easy</div>
    <div id="top-center">
      <div id="stars-row"></div>
      <div id="level-dots"></div>
    </div>
    <div id="level-num">Level 1</div>
  </div>

  <!-- MAIN GAME AREA -->
  <div id="game-wrap">

    <!-- PUZZLE AREA -->
    <div id="puzzle-area">
      <canvas id="trail-canvas"></canvas>

      <!-- Snap hints rendered here by JS -->
      <div id="snap-hints"></div>

      <!-- Snapped parts rendered here -->
      <div id="snap-layer"></div>

      <!-- Parts remaining badge -->
      <div id="parts-counter"></div>
    </div>

    <!-- PARTS TRAY -->
    <div id="tray-wrap">
      <div id="tray-label">⬇ PARTS BIN ⬇</div>
      <div id="parts-tray"></div>
    </div>

  </div>

  <!-- OVERLAYS -->
  <div id="version">v1.2</div>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="clean-overlay" class="hidden">
    <div id="clean-backdrop"></div>
    <div id="clean-content">
      <div id="clean-text">CLEAN! ✨</div>
    </div>
  </div>

  <button id="next-btn" aria-label="Next Level"></button>

  <script src="parts.js?v=1.2"></script>
  <script src="audio.js?v=1.2"></script>
  <script src="game.js?v=1.2"></script>
</body>
</html>
